# いわてデータ MCP サーバー
# 本番URL: https://mcp.iwate-data.com/mcp （workers.dev: https://iwate-data-mcp.oda-2ba.workers.dev/mcp）
# デプロイは Cloudflare Workers Builds が main への push で自動実行する。手動なら cd mcp && npx wrangler login && npx wrangler deploy
name = "iwate-data-mcp"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# データは data/dataset.json をそのままバンドルする（DB不要・KV不要）。
# サイト側で raw を更新して dataset.json を作り直して push すれば、Workers Builds が自動で再デプロイする。
